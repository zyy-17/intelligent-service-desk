server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  compression:
    enabled: true

spring:
  application:
    name: intelligent-service-desk
  datasource:
    url: jdbc:mysql://localhost:3306/intelligent_service_desk?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  mvc:
    throw-exception-if-no-handler-found: false
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/
  data:
    redis:
      # Redis 缓存与临时数据存储（不替代 MySQL 主库）
      host: ${REDIS_HOST:192.168.100.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 3s
      # 不使用 Spring Data Redis 仓库，避免触发多存储严格扫描导致 JDBC 仓库无法注册
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

# ===== 业务配置 =====
app:
  jwt:
    # 生产环境请通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:intelligent-service-desk-default-secret-key-please-change-in-production}
    expire-seconds: 86400
  ai:
    # 云端大模型（OpenAI 兼容接口）：DeepSeek / 通义百炼-compatible / Kimi / 智谱 / OpenAI 均可
    # 该配置由独立 FastAPI AI 服务使用（见 ai-service/ 目录），Java 侧通过 ai-service 调用
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: 45
    temperature: 0.3
  ai-service:
    # 独立 FastAPI AI 服务地址（见 ai-service/ 目录，需单独启动）
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    timeout-seconds: 50
    # AI 助手名称（用于欢迎语；与 ai-service/.env 的 AI_ASSISTANT_NAME 保持一致）
    assistant-name: ${AI_ASSISTANT_NAME:小智}

  # ===== Redis 业务参数 =====
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:isd}
    # 限流阈值：登录 10 次/分钟/IP，AI 问答 20 次/分钟/用户
    login-rate-limit: 10
    ai-rate-limit: 20
    rate-limit-window-seconds: 60
    # 登录失败锁定：15 分钟内失败 5 次锁定
    login-max-failures: 5
    login-fail-window-seconds: 900
    # 缓存 TTL（秒）
    hot-articles-ttl: 300
    categories-ttl: 600
    stats-overview-ttl: 60

  # ===== 演示数据（定时自动造单）=====
  # 每天定时创建工单并按比例模拟客服处理，默认关闭，避免影响真实数据
  demo:
    auto-ticket:
      enabled: ${DEMO_AUTO_TICKET:false}
      # 执行时间：默认每天 09:00
      cron: "${DEMO_AUTO_TICKET_CRON:0 0 9 * * ?}"
      # 每次生成的工单数量
      count: ${DEMO_AUTO_TICKET_COUNT:5}
      # 自动模拟客服处理并解决的比例（0-100），其余留在「待分配」等真人处理
      resolve-percent: ${DEMO_AUTO_TICKET_RESOLVE_PERCENT:60}

logging:
  level:
    root: INFO
    com.zyyqq: INFO
